<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon-48.png" alt="" width="20" height="20" />
    <span class="wordmark">GuardFou</span>
  </header>

  <section id="activate" class="state" hidden>
    <p class="lede" data-i18n="popupActivateLede">GuardFou needs access to the pages you visit to analyze them.</p>
    <button id="activate-btn" class="btn btn-primary" data-i18n="popupActivateButton">Turn on GuardFou</button>
  </section>

  <section id="result" class="state" hidden>
    <div class="score-row">
      <div class="score-ring" id="score-ring">
        <svg viewBox="0 0 120 120" width="84" height="84">
          <circle class="ring-track" cx="60" cy="60" r="52" />
          <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="52" />
        </svg>
        <div class="score-ring-label">
          <span id="score-number" class="score-number">—</span>
        </div>
      </div>
      <div class="score-meta">
        <p id="band-label" class="band-label"></p>
        <p id="domain" class="domain"></p>
      </div>
    </div>

    <ul id="reasons" class="reasons"></ul>
  </section>

  <section id="empty" class="state" hidden>
    <p class="lede muted" data-i18n="popupEmpty">No analysis for this page: it wasn't detected as a shop, or it has only just loaded.</p>
  </section>

  <section id="identity-toggle" class="state" hidden>
    <button id="identity-btn" class="btn btn-ghost" data-i18n="popupIdentityButton">View the site identity card</button>
  </section>

  <section id="identity" class="state" hidden>
    <div class="identity-header">
      <h2 data-i18n="popupIdentityTitle">Identity card</h2>
      <button id="identity-close-btn" class="btn-icon" aria-label="Close" data-i18n-aria-label="popupClose">✕</button>
    </div>
    <p id="identity-loading" class="lede muted" data-i18n="popupIdentityLoading">Analyzing…</p>
    <dl id="identity-fields" class="identity-fields" hidden></dl>
  </section>

  <footer>
    <a id="options-link" href="#" data-i18n="popupSettings">Settings</a>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
