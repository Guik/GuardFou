name: XPI

# Every push/PR: test, lint, and build an unsigned .xpi (downloadable from
# the run's artifacts, installable via about:debugging or in Firefox
# Developer Edition with xpinstall.signatures.required=false).
#
# Pushing a tag like v0.2.0: additionally submits that version to
# addons.mozilla.org (listed channel, listing metadata from
# amo-metadata.json) and creates a GitHub Release. Mozilla reviews listed
# versions before publishing them, which can take days, so the job doesn't
# wait: the signed version appears on the store once approved. The Release
# carries the unsigned build of the exact files submitted. Needs repository
# secrets AMO_JWT_ISSUER / AMO_JWT_SECRET from
# https://addons.mozilla.org/developers/addon/api/key/.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: guardfou-unsigned
          path: web-ext-artifacts/*.xpi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # AMO refuses the same version twice, so the tag is the
      # single source of truth: bump manifest.json, commit, then tag.
      - name: Check tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi

      - name: Submit to addons.mozilla.org
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - uses: actions/download-artifact@v4
        with:
          name: guardfou-unsigned
          path: unsigned

      - name: Publish GitHub Release
        run: |
          for f in unsigned/*.xpi; do mv "$f" "${f%.xpi}-unsigned.xpi"; done
          gh release create "${GITHUB_REF_NAME}" unsigned/*.xpi --title "${GITHUB_REF_NAME}" --generate-notes \
            --notes "Submitted to addons.mozilla.org; install it from https://addons.mozilla.org/firefox/addon/guardfou/ once Mozilla has approved it. The attached .xpi is unsigned, for testing only."
        env:
          GH_TOKEN: ${{ github.token }}
