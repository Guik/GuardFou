name: XPI

# Every push/PR: test, lint, and build an unsigned .xpi (downloadable from
# the run's artifacts, installable via about:debugging or in Firefox
# Developer Edition with xpinstall.signatures.required=false).
#
# Pushing a tag like v0.2.0: additionally has Mozilla sign the add-on
# (unlisted channel = self-distributed, not shown on addons.mozilla.org) and
# attaches the signed .xpi — installable in any regular Firefox — to a
# GitHub Release. Needs repository secrets AMO_JWT_ISSUER / AMO_JWT_SECRET
# from https://addons.mozilla.org/developers/addon/api/key/.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fakeshield-unsigned
          path: web-ext-artifacts/*.xpi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # AMO refuses to sign the same version twice, so the tag is the
      # single source of truth: bump manifest.json, commit, then tag.
      - name: Check tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi

      - name: Sign with Mozilla (unlisted)
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Publish GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" web-ext-artifacts/*.xpi --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
